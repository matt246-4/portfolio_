<!-- Fichier : contact.html -->
<h2>Me Contacter</h2>
<p style="margin-top: 0.5rem;">Un projet ou une question ? N'hésitez pas à m'écrire !</p>

<form style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
    <input type="text" placeholder="Votre nom" style="padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 4px;">
    <input type="email" placeholder="Votre email" style="padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 4px;">
    <textarea rows="4" placeholder="Votre message..." style="padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 4px;"></textarea>
    <button type="submit" class="btn" style="border: none; cursor: pointer; align-self: start;">Envoyer</button>
</form>
